        /* Força a capa a ignorar as margens padrão do PDF para ocupar a folha toda */
        margin: 0 !important;

       usamos o truque de esconder qualquer elemento que renderize a numeração

        /* Se você estiver usando um elemento HTML para simular a numeração,

        counter-increment: none !important;

<script>
// 1. Função que limpa e personaliza qualquer texto que venha do banco

 
const mapa = { A:1,I:1,Q:1,J:1,Y:1, B:2,K:2,R:2, C:3,G:3,L:3,S:3, D:4,M:4,T:4, E:5,H:5,N:5, U:6,V:6,W:6,X:6, O:7,Z:7, F:8,P:8 };

function valorLetra(letra){
    if(!letra || letra===" ") return 0;
    let normal = letra.normalize("NFD");
    let base = normal[0];
    let acentos = normal.slice(1);
    let valorBase = mapa[base] ?? 0;
    let somaAcentos = 0, multAcentos = 1;
    for(let a of acentos){
        if(a === "\u0301") somaAcentos += 2;
        else if(a === "\u0302") somaAcentos += 7;
        else if(a === "\u0303") somaAcentos += 3;
        else if(a === "\u0327") somaAcentos += 3;
        else if (a === "\u030a") somaAcentos += 7;     // Círculo/Grau superior (°)     
        else if(a === "\u0300") multAcentos *= 2;
        else if(a === "\u0308") multAcentos *= 2;
    }
    
    let resultado = (valorBase + somaAcentos) * multAcentos;
    
    // A CORREÇÃO ESTÁ AQUI: 
    // Reduzimos o resultado final para um único dígito (1-9)
    return reduzir(resultado); 
}

function reduzir(n) {
    if (!n || n === 0) return 0;
    // Enquanto for maior que 9, soma os dígitos
    while (n > 9) {
        n = n.toString().split('').reduce((acc, curr) => parseInt(acc) + parseInt(curr), 0);
    }
    return n;
}
    

 function aplicarFiltroTexto(texto) {
    if (!texto || typeof texto !== 'string') {
        return ""; 
    }

    // 1. Captura os valores dos inputs
    const nomeSocial = document.getElementById("nomeSocial").value.trim();
    const nomeCompleto = document.getElementById("nome").value.trim();
    
    let pNome = "";

    // 2. Lógica de Prioridade com extração do primeiro nome:
    if (nomeSocial !== "") {
        // Pega apenas o primeiro nome do campo Nome Social
        pNome = nomeSocial.split(/\s+/)[0];
    } else if (nomeCompleto !== "") {
        // Pega apenas o primeiro nome do campo Nome Completo
        pNome = nomeCompleto.split(/\s+/)[0];
    } else {
        // Valor padrão caso ambos estejam vazios
        pNome = "MASCULINO-FEMININO-NEUTRO";
    }

    // 3. Aplica a substituição no texto com a tag strong
    return texto.replace(/MASCULINO-FEMININO-NEUTRO/gi, `<strong>${pNome}</strong>`);
}

function aplicarFiltroNomeComposto(texto) {
    // Se o texto não existir, for nulo ou não for uma string, retorna vazio
    if (!texto || typeof texto !== 'string') {
        return ""; 
    }

    // Pega o valor do input, remove espaços inúteis e divide por espaços
    let partesNome = document.getElementById("nome").value.trim().split(/\s+/);
    
    // Pega os dois primeiros elementos e junta com um espaço
    // Se só houver um nome, o join lidará com isso graciosamente
    let pNome = partesNome.slice(0, 2).join(' ') || "MASCULINO-FEMININO-NEUTRO";

    // Retorna o texto substituindo a tag pelo nome em negrito
    return texto.replace(/MASCULINO-FEMININO-NEUTRO/gi, `<strong>${pNome}</strong>`);
}   



function nomeNumeros(nome){
    nome=nome.toUpperCase();
    let arr=[];
    for(let l of nome){ if(l!==" "){ let v=valorLetra(l); if(v)arr.push(v); } }
    return arr;
}

function piramide(base){
    let b = [...base];
    let linhas=[b];
    while(b.length>1){
        let nova=[];
        for(let i=0;i<b.length-1;i++){ nova.push(reduzir(b[i]+b[i+1])); }
        linhas.push(nova);
        b=nova;
    }
    return linhas;
}

function topo(base){
    let arcanos = [];
    for(let i=0; i<base.length-1; i++){ arcanos.push(parseInt("" + base[i] + base[i+1])); }
    return arcanos;
}

// --- FUNÇÃO DE APOIO: CÁLCULO LINEAR VERTICAL ---
function calcularVigenciaLinearVertical(coluna, tamanhoSeq, cronograma, arcanosTopo) {
    let detalhes = [];
    // Cada número da sequência pega a potência da sua própria coluna no topo
    for (let i = 0; i < tamanhoSeq; i++) {
        let indiceColuna = coluna + i;
        let arcRef = arcanosTopo[indiceColuna]; 
        let periodo = cronograma.find(p => p.indiceArcano === indiceColuna);
        
        if (periodo) {
            detalhes.push({
                potencia: arcRef,
                duracao: parseInt(arcRef.toString()[0]) || 1,
                idadeIni: periodo.idadeIni,
                idadeFim: periodo.idadeFim
            });
        }
    }
    return detalhes;
}

function gerarCronogramaMestre(arcanosVida, data) {
    let cronograma = [];
    const [ano, mes, dia] = data.split("-").map(Number);
    let atual = new Date(ano, mes - 1, dia);
    let idade = 0, contadorCiclo = 0;
    while (idade < 100) {
        let indice = contadorCiclo % arcanosVida.length;
        let arc_ref = arcanosVida[indice];
        let anosDuracao = parseInt(arc_ref.toString()[0]);
        if (anosDuracao === 0 || isNaN(anosDuracao)) anosDuracao = 1;
        let inicio = new Date(atual);
        atual.setFullYear(atual.getFullYear() + anosDuracao);
        cronograma.push({
            idadeIni: idade, idadeFim: idade + anosDuracao,
            ini: inicio.toLocaleDateString('pt-BR'), fim: atual.toLocaleDateString('pt-BR'),
            indiceArcano: indice 
        });
        idade += anosDuracao;
        contadorCiclo++;
    }
    return cronograma;
}

function calcularPeriodoSequencia(periodoBase, duracaoTotal) {

    let [dia, mes, ano] = periodoBase.ini.split("/").map(Number);

    let dataIni = new Date(ano, mes - 1, dia);
    let dataFim = new Date(dataIni);

    dataFim.setFullYear(dataFim.getFullYear() + duracaoTotal);

    return {
        ini: dataIni.toLocaleDateString('pt-BR'),
        fim: dataFim.toLocaleDateString('pt-BR')
    };
}

function gerarLoopNegativo(mV, mP, mS, mD, crono) {

function detectarSequencias(linhas){
    let posNeg=[]; let sequencias=[];
    linhas.forEach((linha, i)=>{
        let cont=1;
        for(let j=1;j<linha.length;j++){
            if(linha[j] === linha[j-1]) cont++;
            else {
                if(cont>=3){
                    sequencias.push({numero: linha[j-1], repeticoes: cont});
                    for(let k=j-cont;k<j;k++) posNeg.push({linha:i,indice:k});
                }
                cont=1;
            }
        }
        if(cont>=3){
            sequencias.push({numero: linha[linha.length-1], repeticoes: cont});
            for(let k=linha.length-cont;k<linha.length;k++) posNeg.push({linha:i,indice:k});
        }
    });
    return {sequencias, posNeg};
}

function detectarPosicoesEspeciais(linhas, bancoEsp){
    let pos=[];
    // Se não vier um banco específico, tenta pegar o global
    const esp = bancoEsp || window.sequenciasEspeciais || {};
    
    linhas.forEach((linha, i) => {
        for(let j=0; j < linha.length - 2; j++){
            let seq = "" + linha[j] + linha[j + 1] + linha[j + 2];
            if(esp[seq]){ 
                pos.push({linha:i, indice:j}, {linha:i, indice:j+1}, {linha:i, indice:j+2}); 
            }
        }
    });
    return pos;
}

function detectarSequenciaFinanceira(linhas){
    let pos=[];
    for(let i=0; i<linhas.length-1; i++){
        for(let j=0; j<linhas[i].length-1; j++){
            if(linhas[i][j]===9 && linhas[i][j+1]===9 && linhas[i+1][j]===9){
                pos.push({linha:i, indice:j},{linha:i, indice:j+1},{linha:i+1, indice:j});
            }
        }
    }
    return pos;
}



function obterMapaCores(linhas, tipoPira) {
    let mapa = linhas.map(linha => linha.map(() => ""));

    // 1. REGENTE
    mapa[mapa.length - 1][0] = "regente";

    // 2. PEGAR O BANCO DE DADOS
// 2. SELEÇÃO DO BANCO (Ajustado para buscar a const direto)
    let bancoEspecial = {};
    const t = String(tipoPira).toUpperCase();
    
    // Tentamos pegar a variável global (window) ou a const direta
    if(t.includes("VIDA")) bancoEspecial = (typeof textosSeqEspVida !== 'undefined') ? textosSeqEspVida : {};
    else if(t.includes("PESSOAL")) bancoEspecial = (typeof textosSeqEspPessoal !== 'undefined') ? textosSeqEspPessoal : {};
    else if(t.includes("SOCIAL")) bancoEspecial = (typeof textosSeqEspSocial !== 'undefined') ? textosSeqEspSocial : {};
    else if(t.includes("DESTINO")) bancoEspecial = (typeof textosSeqEspDestino !== 'undefined') ? textosSeqEspDestino : {};

    linhas.forEach((linha, i) => {
        
        // --- 3. SEQUÊNCIAS FINANCEIRAS (VERDE - 99/9) ---
        // Adicionada de volta com prioridade
        if (i < linhas.length - 1) {
            for (let j = 0; j < linha.length - 1; j++) {
                let v1 = String(linha[j]).split('').pop();
                let v2 = String(linha[j+1]).split('').pop();
                let v3 = String(linhas[i+1][j]).split('').pop();

                if (v1 === "9" && v2 === "9" && v3 === "9") {
                    mapa[i][j] = "financeiro";
                    mapa[i][j+1] = "financeiro";
                    mapa[i+1][j] = "financeiro";
                }
            }
        }

        // --- 4. SEQUÊNCIAS ESPECIAIS (DOURADO) ---
        for (let j = 0; j < linha.length - 2; j++) {
            let n1 = String(linha[j]).split('').pop();
            let n2 = String(linha[j+1]).split('').pop();
            let n3 = String(linha[j+2]).split('').pop();
            let seq = n1 + n2 + n3;
            
            // Pinta de dourado se existir no banco e não for financeiro
            if (bancoEspecial[seq]) {
                if (mapa[i][j] === "") mapa[i][j] = "especial";
                if (mapa[i][j+1] === "") mapa[i][j+1] = "especial";
                if (mapa[i][j+2] === "") mapa[i][j+2] = "especial";
            }
        }
        
        // --- 5. SEQUÊNCIAS NEGATIVAS (VERMELHO) ---
        let jNeg = 0;
        while (jNeg < linha.length) {
            let num = String(linha[jNeg]).split('').pop();
            let cont = 1;
            while (jNeg + cont < linha.length && String(linha[jNeg+cont]).split('').pop() === num) { cont++; }
            
            if (cont >= 3) {
                for (let k = 0; k < cont; k++) {
                    // Só pinta de vermelho se o espaço ainda estiver vazio (branco)
                    if (mapa[i][jNeg + k] === "") {
                        mapa[i][jNeg + k] = "negativo";
                    }
                }
                jNeg += cont;
            } else { jNeg++; }
        }
    });

    return mapa;
}



    
function desenhar(linhas, tipoPira = "VIDA", compacta = false, nomeRaw = "") {
    const mapaCores = obterMapaCores(linhas, tipoPira);
    let classePira = compacta ? "piramide compacta" : "piramide";
    let html = `<div class="${classePira}">`;

    // --- NOVA PARTE: LINHA DO NOME NO TOPO ---
    if (nomeRaw) {
        const letrasNomeTopo = nomeRaw.toUpperCase().replace(/\s+/g, '').split('');
        html += `<div class="linha linha-letras" style="margin-bottom: 5px; display: flex; justify-content: center; gap: 2px;">`;
        letrasNomeTopo.forEach(letra => {
            html += `<div class="num-letra" style="width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; color: #000E52; font-size: 18px; font-weight: 900; background: transparent; border-radius: 2px;">${letra}</div>`;
        });
        html += `</div>`;
    }

    // DESENHO DAS LINHAS DE NÚMEROS
    linhas.forEach((linha, i) => {
        html += `<div class="linha">`;
        linha.forEach((num, j) => {
            let corClasse = mapaCores[i][j];

            // --- ADIÇÃO DO REGENTE AQUI ---

            if (i === linhas.length - 1) {

            // ------------------------------

            html += `<div class="num ${corClasse}">${num}</div>`;
        });
        html += `</div>`;
    });

    html += `</div>`;
    return html;
}

if (distancia < 0) {

<script>
function verificarLiberacaoMenu(diasPassados) {
    
    const estaLiberado = diasPassados >= 7;

    // Criamos um vigia que vai olhar a página até o elemento aparecer
    const observer = new MutationObserver((mutations, obs) => {
        const container = document.getElementById('container-travado');
        const aviso = document.getElementById('aviso-trava-menu');

        if (container && aviso) {
            // Se encontrou, aplica a lógica
            if (estaLiberado) {
                container.style.setProperty('display', 'block', 'important');
                aviso.style.setProperty('display', 'none', 'important');
            } else {
                container.style.setProperty('display', 'none', 'important');
                aviso.style.setProperty('display', 'block', 'important');
            }
            
            console.log("Menu liberado/bloqueado com sucesso pelo vigia.");
            obs.disconnect(); // Para de vigiar para não consumir processamento
        }
    });

    // Começa a vigiar o corpo da página inteira
    observer.observe(document.body, {
        childList: true,
        subtree: true
    });
}
</script>
